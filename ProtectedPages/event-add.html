<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BandLife Create Event Page" />
    <link rel="stylesheet" href="../css/bandlife.css" />
    <title>BandLife Add Event</title>
</head>

<body>
    <main>
        <div id="wrapper">
            <header id="main-head">
                <p>BandLife</p>
            </header>
            <div id="main-nav">
            </div>
            <h1 id="content-head">Add Event</h1>
            <article class="content">
                <section>
                    <form id="add-event">
                        <fieldset>
                            <label for="name">Name</label>
                            <input type="text" id="name" required />
                            <label for="category">Category</label>
                            <input type="text" id="category" required />
                            <label for="description">Description</label>
                            <textarea id="description" minlength="3" rows="4" required></textarea>

                            <hr />
                            <span class="option-span">Option 1</span>
                            <hr />

                            <label>
                                Option
                                <textarea
                                    class="option-one"
                                    data-field="text"
                                    minlength="3"
                                    rows="4"
                                    required></textarea>
                            </label>

                            <label>
                                Outcome
                                <textarea
                                    class="option-one"
                                    data-field="outcome"
                                    minlength="3"
                                    rows="4"
                                    required></textarea>
                            </label>

                            <label>
                                Members
                                <input
                                    type="number"
                                    class="option-one"
                                    data-field="membersModifier"
                                    value="0"
                                    required>
                            </label>

                            <label>
                                Job
                                <input
                                    type="text"
                                    class="option-one"
                                    data-field="newJob">
                            </label>

                            <label>
                                Job Income
                                <input
                                    type="number"
                                    class="option-one"
                                    data-field="jobIncomeModifier"
                                    value="0">
                            </label>

                            <label>
                                Band Income
                                <input
                                    type="number"
                                    class="option-one"
                                    data-field="bandIncomeModifier"
                                    value="0">
                            </label>

                            <label>
                                Popularity
                                <input
                                    type="text"
                                    class="option-one"
                                    data-field="newPopularityLevel">
                            </label>

                            <label>
                                Listeners
                                <input
                                    type="number"
                                    class="option-one"
                                    data-field="listenersModifier"
                                    value="0">
                            </label>

                            <hr />
                            <span class="option-span">Option 2</span>
                            <hr />

                            <label>
                                Option
                                <textarea
                                    class="option-two"
                                    data-field="text"
                                    minlength="3"
                                    rows="4"
                                    required></textarea>
                            </label>

                            <label>
                                Outcome
                                <textarea
                                    class="option-two"
                                    data-field="outcome"
                                    minlength="3"
                                    rows="4"
                                    required></textarea>
                            </label>

                            <label>
                                Members
                                <input
                                    type="number"
                                    class="option-two"
                                    data-field="membersModifier"
                                    value="0"
                                    required>
                            </label>

                            <label>
                                Job
                                <input
                                    type="text"
                                    class="option-two"
                                    data-field="newJob">
                            </label>

                            <label>
                                Job Income
                                <input
                                    type="number"
                                    class="option-two"
                                    data-field="jobIncomeModifier"
                                    value="0">
                            </label>

                            <label>
                                Band Income
                                <input
                                    type="number"
                                    class="option-two"
                                    data-field="bandIncomeModifier"
                                    value="0">
                            </label>

                            <label>
                                Popularity
                                <input
                                    type="text"
                                    class="option-two"
                                    data-field="newPopularityLevel">
                            </label>

                            <label>
                                Listeners
                                <input
                                    type="number"
                                    class="option-two"
                                    data-field="listenersModifier"
                                    value="0">
                            </label>

                            <hr />
                            <span class="option-span">Option 3</span>
                            <hr />

                            <label>
                                Option
                                <textarea
                                    class="option-three"
                                    data-field="text"
                                    minlength="3"
                                    rows="4"></textarea>
                            </label>

                            <label>
                                Outcome
                                <textarea
                                    class="option-three"
                                    data-field="outcome"
                                    minlength="3"
                                    rows="4"></textarea>
                            </label>

                            <label>
                                Members
                                <input
                                    type="number"
                                    class="option-three"
                                    data-field="membersModifier"
                                    value="0">
                            </label>

                            <label>
                                Job
                                <input
                                    type="text"
                                    class="option-three"
                                    data-field="newJob">
                            </label>

                            <label>
                                Job Income
                                <input
                                    type="number"
                                    class="option-three"
                                    data-field="jobIncomeModifier"
                                    value="0">
                            </label>

                            <label>
                                Band Income
                                <input
                                    type="number"
                                    class="option-three"
                                    data-field="bandIncomeModifier"
                                    value="0">
                            </label>

                            <label>
                                Popularity
                                <input
                                    type="text"
                                    class="option-three"
                                    data-field="newPopularityLevel">
                            </label>

                            <label>
                                Listeners
                                <input
                                    type="number"
                                    class="option-three"
                                    data-field="listenersModifier"
                                    value="0">
                            </label>

                            <hr />
                            <span class="option-span">Option 4</span>
                            <hr />

                            <label>
                                Option
                                <textarea
                                    class="option-four"
                                    data-field="text"
                                    minlength="3"
                                    rows="4"></textarea>
                            </label>

                            <label>
                                Outcome
                                <textarea
                                    class="option-four"
                                    data-field="outcome"
                                    minlength="3"
                                    rows="4"></textarea>
                            </label>

                            <label>
                                Members
                                <input
                                    type="number"
                                    class="option-four"
                                    data-field="membersModifier"
                                    value="0">
                            </label>

                            <label>
                                Job
                                <input
                                    type="text"
                                    class="option-four"
                                    data-field="newJob">
                            </label>

                            <label>
                                Job Income
                                <input
                                    type="number"
                                    class="option-four"
                                    data-field="jobIncomeModifier"
                                    value="0">
                            </label>

                            <label>
                                Band Income
                                <input
                                    type="number"
                                    class="option-four"
                                    data-field="bandIncomeModifier"
                                    value="0">
                            </label>

                            <label>
                                Popularity
                                <input
                                    type="text"
                                    class="option-four"
                                    data-field="newPopularityLevel">
                            </label>

                            <label>
                                Listeners
                                <input
                                    type="number"
                                    class="option-four"
                                    data-field="listenersModifier"
                                    value="0">
                            </label>

                            <button type="submit">Send</button>

                        </fieldset>
                    </form>
                </section>
            </article>
            <div id="main-footer">
            </div>
        </div>
    </main>
</body>

</html>
<script type="module" src="../js/event-add.js"></script>
<script type="module" src="../js/shared.js"></script>
