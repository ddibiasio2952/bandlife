<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BandLife Modify Event Page" />
    <link rel="stylesheet" href="../css/bandlife.css" />
    <title>BandLife Modify Event</title>
</head>

<body>
    <main>
        <div id="wrapper">
            <header id="main-head">
                <p>BandLife</p>
            </header>
            <div id="main-nav">
            </div>
            <h1 id="content-head">Modify Event</h1>
            <article class="content">
                <section>
                    <form id="modify-event">
                        <fieldset>
                            <label for="id">Id</label>
                            <input type="number" id="id" disabled required />
                            <label for="name">Name</label>
                            <input type="text" id="name" required />
                            <label for="category">Category</label>
                            <input type="text" id="category" required />
                            <label for="description">Description</label>
                            <textarea id="description" minlength="3" rows="4" required></textarea>

                            <table id="event-table">
                                <thead>
                                    <tr id="event-table-header">
                                        <th>Outcome Id</th>
                                        <th>Option</th>
                                        <th>Modify</th>
                                    </tr>
                                </thead>
                                <tbody id="event-table-body">
                                </tbody>
                            </table>
                            <button type="button" id="modify-event-button">Modify</button>

                        </fieldset>

                    </form>
                </section>
                
                <div id="modify-modal" class="hidden">
                    <form>
                        <fieldset>
                            <div id="close-modal">✖</div>

                            <label for="option-id">Option Id</label>
                            <input type="number" id="option-id" disabled required />

                            <label for="option">Option</label>
                            <textarea id="option" class="options" minlength="3" rows="4" required></textarea>

                            <label for="outcome">Outcome</label>
                            <textarea id="outcome" class="outcomes" minlength="3" rows="4" required></textarea>

                            <label for="members">Members</label>
                            <input type="number" id="members" class="members" required />

                            <label for="job">Job</label>
                            <input type="text" id="job" class="job" />

                            <label for="job-income">Job Income</label>
                            <input type="number" id="job-income" class="job-income" />

                            <label for="band-income">Band Income</label>
                            <input type="number" id="band-income" class="band-income" />

                            <label for="popularity">Popularity</label>
                            <input type="text" id="popularity" class="popularity" />

                            <label for="listeners">Listeners</label>
                            <input type="number" id="listeners" class="listeners" />

                            <label for="event-id" hidden></label>
                            <input type="number" id="event-id" disabled required hidden />

                            <button type="button" id="modify-option-button">Modify</button>

                        </fieldset>
                    </form>
                </div>
                
            </article>
            <div id="main-footer">
            </div>
        </div>
    </main>
</body>

</html>
<script type="module" src="../js/event-modify.js"></script>
<script type="module" src="../js/shared.js"></script>
