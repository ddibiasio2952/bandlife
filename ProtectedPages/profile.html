<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BandLife Profile Page" />
    <link rel="stylesheet" href="../css/bandlife.css" />
    <title>BandLife Home</title>
</head>

<body class="authentication-pending">
    <main id="protected-content">
        <div id="wrapper">
            <header id="main-head">
                <p>BandLife</p>
            </header>
            <div id="main-nav">
            </div>
            <h1 id="content-head">Profile</h1>
            <article id="profile-content">
                <section id="profile-text">
                    <p id="profile-one">
                    </p>
                    <p id="profile-two">
                    </p>
                </section>
                <section id="profile-tabs">
                    <div id="band-div" class="band">
                        <p>Band</p>
                        <span id="band"></span>
                    </div>
                    <div id="genre-div" class="genre">
                        <p>Genre</p>
                        <span id="genre"></span>
                    </div>
                    <div id="members-div" class="members">
                        <p>Members</p>
                        <span id="members"></span>
                    </div>
                    <div id="releases-div" class="releases">
                        <p>Releases</p>
                        <span id="releases">Releases</span>
                    </div>
                    <div id="job-div" class="job">
                        <p>Your Job</p>
                        <span id="job"></span>
                    </div>
                    <div id="job-income-div" class="job-income">
                        <p>Your Income</p>
                        <span id="job-income"></span>
                    </div>
                    <div id="band-income-div" class="band-income">
                        <p>Band Income</p>
                        <span id="band-income"></span>
                    </div>
                    <div id="listeners-div" class="listeners">
                        <p>Listeners</p>
                        <span id="listeners"></span>
                    </div>
                    <div id="popularity-div" class="popularity">
                        <p>Popularity</p>
                        <span id="popularity"></span>
                    </div>

                </section>
            </article>
            <div id="main-footer">
            </div>
        </div>
    </main>
</body>

</html>
<script type="module" src="../js/profile.js"></script>
<script type="module" src="../js/shared.js"></script>
