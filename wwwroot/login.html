<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BandLife Login Page" />
    <link rel="stylesheet" href="../css/bandlife.css" />
    <title>BandLife Log In</title>
</head>

<body>
    <main>
        <div id="wrapper">
            <header id="main-head">
                <p>BandLife</p>
            </header>
            <nav id="login-nav">
                <ul>
                    <li><a href="./pages/register.html" class="nav-link" id="register-link">Register</a></li>
                </ul>
            </nav>
            <h1 id="content-head">Log In</h1>

            <article class="content">
                <section>
                    <form id="login-form" method="POST">
                        <fieldset>
                            <label for="email">Email</label>
                            <input type="email" id="login-email" spellcheck="false" autocomplete="email" required />
                            <label for="password">Password</label>
                            <input type="password" id="login-password" autocomplete="current-password" required />

                            <div id="remember-login">
                                <input type="checkbox" id="remember-me" />
                                <label for="remember-me" id="remember-me-label">Remember Me</label>
                            </div>

                            <button type="submit" id="submit-login">Login</button>
                            <p id="login-error"></p>
                        </fieldset>
                    </form>
                </section>
            </article>
            <footer class="main-footer">
                <address>
                    <p>Contact Webmaster: <a href="mailto:email" id="email">email</a></p>
                    <p>&copy; 2026 BandLife</p>
                </address>
            </footer>
        </div>
    </main>
</body>

</html>
<script type="module" src="./js/login.js"></script>
