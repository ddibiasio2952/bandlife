<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BandLife Registration Page" />
    <link rel="stylesheet" href="../css/bandlife.css" />
    <title>BandLife Register</title>
</head>

<body>
    <main>
        <div id="wrapper">
            <header id="main-head">
                <p>BandLife</p>
            </header>
            <nav id="register-nav">
                <ul>
                    <li><a href="../login.html" class="nav-link" id="log-in">Log In</a></li>
                </ul>
            </nav>
            <h1 id="content-head">Register</h1>
            <!-- Log In -->
            <article class="content">
                <section>
                    <form id="register" method="POST">
                        <fieldset>
                            <label for="email">Email</label>
                            <input type="email" id="email" minlength="3" maxlength="50" required />
                            <label for="password">Password</label>
                            <input type="password"
                                   id="password"
                                   minlength="8"
                                   maxlength="30"
                                   autocomplete="new-password"
                                   required />
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password"
                                   id="confirm-password"
                                   minlength="8"
                                   maxlength="30"
                                   autocomplete="new-password"
                                   required />
                            <label for="name">Your Name</label>
                            <input type="text" id="name" spellcheck="false" minlength="2" maxlength="25" required />
                            <label for="band">Band Name</label>
                            <input type="text" id="band" spellcheck="false" minlength="1" maxlength="50" required />
                            <label for="instrument">Role</label>
                            <select for="instrument" id="instrument" required>
                                <option value="">Select Your Role</option>
                                <option value="Singing">Singing</option>
                                <option value="Guitar">Guitar</option>
                                <option value="Bass">Bass</option>
                                <option value="Keyboard">Keyboard</option>
                                <option value="Drums">Drums</option>
                            </select>
                            <label for="genreOne">Your Band's Genre</label>
                            <input type="text" class="genre" id="genreOne" spellcheck="false" minlength="3" maxlength="25" required />
                            <label for="genreTwo">A Genre You Like</label>
                            <input type="text" class="genre" id="genreTwo" spellcheck="false" minlength="3" maxlength="25" required />
                            <label for="genreThree">A Genre You Dislike</label>
                            <input type="text" class="genre" id="genreThree" spellcheck="false" minlength="3" maxlength="25" required />
                            <label for="genreFour">Another Genre You Dislike</label>
                            <input type="text" class="genre" id="genreFour" spellcheck="false" minlength="3" maxlength="25" required />

                            <button type="submit">Send</button>

                        </fieldset>
                    </form>
                </section>
            </article>
            <footer class="main-footer">
                <address>
                    <p>Contact Webmaster: <a href="mailto:ddibiasio_2952@email.ric.edu" id="email">ddibiasio_2952@email.ric.edu</a></p>
                    <p>&copy; 2026 BandLife</p>
                </address>
            </footer>
        </div>
    </main>
</body>

</html>
<script type="module" src="../js/register.js"></script>
