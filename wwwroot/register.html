<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="template page" />
    <link rel="stylesheet" href="./css/bandlife.css" />
    <title>BandLife Register</title>
</head>

<body>
    <main>
        <div class="wrapper">
            <header class="main-head">
            </header>
            <nav class="main-nav">
                <ul>
                    <li><a href=".\pages\home.html" class="nav-link">Home</a></li>
                    <li><a href="" class="nav-link">Profile</a></li>
                    <li><a href=".\pages\events.html" class="nav-link">Events</a></li>
                    <li><a href=".\pages\event-add.html" class="nav-link">Add</a></li>
                    <li><a href=".\pages\event-list.html" class="nav-link">List</a></li>
                </ul>
            </nav>
            <article class="content">
                <h1 class="content-head">Register</h1>
                <h4>or</h4>
                <h3 class="login-content-subheader"><span class="login-text">Log In</span></h3>
                <!-- Log In -->
                <div class="modal-login">
                    <div class="modal-content">
                        <p class="login-content-subheader">Log In</p>
                        <form id="login">
                            <label for="band">Band Name</label>
                            <input type="text" id="login-band" spellcheck="false" />
                            <button type="button" id="submit-login">Login</button>
                            <button id="close-modal">Close</button>
                        </form>
                    </div>
                </div>

                <section>
                    <form id="register">
                        <fieldset>
                            <label for="email">Email</label>
                            <input type="email" id="email" spellcheck="false" required />
                            <label for="band">Band Name</label>
                            <input type="text" id="band" spellcheck="false" required />
                            <label for="instrument">Role</label>
                            <select for="instrument" id="instrument" required>
                                <option value="">Select Your Role</option>
                                <option value="Singing">Singing</option>
                                <option value="Guitar">Guitar</option>
                                <option value="Bass">Bass</option>
                                <option value="Keyboard">Keyboard</option>
                                <option value="Drums">Drums</option>
                            </select>       
                            <label for="genreOne">Your Band's Genre</label>
                            <input type="text" class="genre" id="genreOne" spellcheck="false" minlength="3" maxlength="25" required />
                            <label for="genreTwo">A Genre You Like</label>
                            <input type="text" class="genre" id="genreTwo" spellcheck="false" minlength="3" maxlength="25" required />
                            <label for="genreThree">A Genre You Dislike</label>
                            <input type="text" class="genre" id="genreThree" spellcheck="false" minlength="3" maxlength="25" required />
                            <label for="genreFour">Another Genre You Dislike</label>
                            <input type="text" class="genre" id="genreFour" spellcheck="false" minlength="3" maxlength="25" required />
                            
                            <button type="submit">Send</button>

                        </fieldset>
                    </form>
                </section>
            </article>
            <footer class="main-footer">
                <address>
                    <p>Contact Webmaster: <a href="mailto:email" id="email">email</a></p>
                </address>
            </footer>
        </div>
    </main>
</body>

</html>
<script src=".\js\register.js"></script>
